name: Build Budget Buddy

on:
  workflow_dispatch:
  push:
    paths:
      - "BudgetBuddy-GitHub-Upload.zip"
      - ".github/workflows/budgetbuddy.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Budget Buddy
        run: |
          unzip -o BudgetBuddy-GitHub-Upload.zip
          ls -la
          ls -la BudgetBuddy

      - name: Build APK
        working-directory: BudgetBuddy
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BudgetBuddy-debug
          path: BudgetBuddy/app/build/outputs/apk/debug/app-debug.apk
